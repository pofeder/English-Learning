<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词本 · 考研英语每日阅读</title>
    <link rel="stylesheet" href="/static/css/style.css?v=8">
</head>
<body>
    <div class="toast-container" id="toast-container"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-brand">
                <div class="brand-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                </div>
                <div>
                    <h1 class="app-title">单词本</h1>
                    <span class="app-subtitle">Vocabulary Notebook</span>
                </div>
            </div>
            <nav class="header-nav">
                <a href="/" class="nav-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    返回阅读
                </a>
            </nav>
        </div>
    </header>

    <main class="main">
        <!-- Tab bar -->
        <div class="vocab-tabs" id="vocab-tabs">
            <button class="vocab-tab active" data-status="">全部 (<span id="count-all">0</span>)</button>
            <button class="vocab-tab" data-status="unfamiliar">未掌握 (<span id="count-unfamiliar">0</span>)</button>
            <button class="vocab-tab" data-status="learning">学习中 (<span id="count-learning">0</span>)</button>
            <button class="vocab-tab" data-status="mastered">已掌握 (<span id="count-mastered">0</span>)</button>
        </div>

        <!-- Word list -->
        <div id="vocab-loading" class="loading-area">
            <div class="skeleton skeleton-line"></div>
            <div class="skeleton skeleton-line w-80"></div>
            <div class="skeleton skeleton-line w-60"></div>
        </div>
        <div id="vocab-list" class="vocab-list" style="display:none;"></div>

        <!-- Pagination -->
        <div id="vocab-pagination" class="vocab-pagination" style="display:none;"></div>
    </main>

    <script>
    (() => {
        let currentStatus = "";
        let currentPage = 1;
        let totalPages = 1;

        window.Toast = {
            show(msg, type = "") {
                const c = document.getElementById("toast-container");
                const t = document.createElement("div");
                t.className = "toast " + type;
                t.textContent = msg;
                c.appendChild(t);
                setTimeout(() => { if (t.parentNode) t.remove(); }, 3200);
            }
        };

        // Tab switching
        document.getElementById("vocab-tabs").addEventListener("click", (e) => {
            const tab = e.target.closest(".vocab-tab");
            if (!tab) return;
            document.querySelectorAll(".vocab-tab").forEach(t => t.classList.remove("active"));
            tab.classList.add("active");
            currentStatus = tab.dataset.status;
            currentPage = 1;
            loadVocabulary();
        });

        async function loadVocabulary() {
            const container = document.getElementById("vocab-list");
            const loading = document.getElementById("vocab-loading");
            const pagination = document.getElementById("vocab-pagination");

            loading.style.display = "block";
            container.style.display = "none";
            pagination.style.display = "none";

            const params = new URLSearchParams({ page: currentPage, per_page: 30 });
            if (currentStatus) params.set("status", currentStatus);

            try {
                const resp = await fetch("/api/vocabulary?" + params.toString());
                const data = await resp.json();

                // Update tab counts
                document.getElementById("count-all").textContent = data.counts.total;
                document.getElementById("count-unfamiliar").textContent = data.counts.unfamiliar;
                document.getElementById("count-learning").textContent = data.counts.learning;
                document.getElementById("count-mastered").textContent = data.counts.mastered;

                totalPages = Math.ceil(data.total / data.per_page) || 1;

                if (data.words.length === 0) {
                    container.innerHTML = '<div class="vocab-empty"><p>暂无单词记录</p><p style="font-size:0.85rem;color:var(--ink-muted);">在阅读文章时点击单词然后点击「不熟悉」按钮，即可将单词加入此列表</p></div>';
                } else {
                    container.innerHTML = data.words.map((w, i) => renderWordCard(w, (currentPage - 1) * 30 + i + 1)).join("");
                }

                // Pagination
                pagination.innerHTML = renderPagination();
                pagination.querySelectorAll(".page-btn").forEach(btn => {
                    btn.addEventListener("click", () => {
                        const p = parseInt(btn.dataset.page);
                        if (p && p !== currentPage) { currentPage = p; loadVocabulary(); window.scrollTo(0, 0); }
                    });
                });

                // Action buttons
                container.querySelectorAll(".v-status-btn").forEach(btn => {
                    btn.addEventListener("click", async (e) => {
                        const word = btn.dataset.word;
                        const status = btn.dataset.status;
                        try {
                            const r = await fetch("/api/vocabulary/" + word, {
                                method: "PATCH",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ status }),
                            });
                            if (r.ok) {
                                Toast.show(`"${word}" 已标记为${statusLabel(status)}`, "success");
                                loadVocabulary();
                            }
                        } catch(er) { Toast.show("操作失败", "error"); }
                    });
                });
                container.querySelectorAll(".v-delete-btn").forEach(btn => {
                    btn.addEventListener("click", async () => {
                        const word = btn.dataset.word;
                        if (!confirm(`确定要从单词本中删除 "${word}" 吗？`)) return;
                        try {
                            const r = await fetch("/api/vocabulary/" + word, { method: "DELETE" });
                            if (r.ok) { Toast.show("已删除", "success"); loadVocabulary(); }
                        } catch(er) { Toast.show("删除失败", "error"); }
                    });
                });

                container.style.display = "block";
                pagination.style.display = data.total > data.per_page ? "flex" : "none";
            } catch (e) {
                container.innerHTML = '<p style="color:var(--red);text-align:center;">加载失败: ' + e.message + '</p>';
                container.style.display = "block";
            } finally {
                loading.style.display = "none";
            }
        }

        function statusLabel(s) {
            return { unfamiliar: "未掌握", learning: "学习中", mastered: "已掌握" }[s] || s;
        }

        function renderWordCard(w, idx) {
            const statusClass = w.status === "mastered" ? "v-status-mastered" : w.status === "learning" ? "v-status-learning" : "v-status-unfamiliar";
            const nextStatus = w.status === "unfamiliar" ? "learning" : "mastered";

            let meaningHtml = w.chinese_meaning ? `<span class="v-meaning">${esc(w.chinese_meaning)}</span>` : "";
            let posHtml = w.part_of_speech ? `<span class="v-pos">${esc(w.part_of_speech)}</span>` : "";
            let countBadge = w.lookup_count > 1 ? `<span class="v-count-badge">查了 ${w.lookup_count} 次</span>` : "";

            let actions = "";
            if (w.status === "unfamiliar") {
                actions = `<button class="v-status-btn v-btn-learning" data-word="${esc(w.word)}" data-status="learning">标记学习中</button>
                           <button class="v-status-btn v-btn-mastered" data-word="${esc(w.word)}" data-status="mastered">标记已掌握</button>`;
            } else if (w.status === "learning") {
                actions = `<button class="v-status-btn v-btn-mastered" data-word="${esc(w.word)}" data-status="mastered">标记已掌握</button>`;
            }
            actions += `<button class="v-delete-btn" data-word="${esc(w.word)}" title="删除">×</button>`;

            return `
                <div class="vocab-card ${statusClass}">
                    <div class="v-number">${idx}</div>
                    <div class="v-main">
                        <div class="v-word-row">
                            <span class="v-word">${esc(w.word)}</span>${posHtml}${countBadge}
                        </div>
                        ${meaningHtml}
                    </div>
                    <div class="v-actions">${actions}</div>
                </div>`;
        }

        function renderPagination() {
            let html = "";
            if (currentPage > 1) html += `<button class="page-btn" data-page="${currentPage - 1}">上一页</button>`;
            html += `<span class="page-info">${currentPage} / ${totalPages}</span>`;
            if (currentPage < totalPages) html += `<button class="page-btn" data-page="${currentPage + 1}">下一页</button>`;
            return html;
        }

        function esc(s) {
            if (!s) return "";
            const d = document.createElement("div");
            d.textContent = s;
            return d.innerHTML;
        }

        loadVocabulary();
    })();
    </script>
</body>
</html>
